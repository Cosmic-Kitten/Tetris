<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A classic Tetris game you can play in the browser or install as an app." />
    <title>Tetris</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css?v=6" />
  </head>
  <body>
    <main class="game-shell">
      <aside class="side-panel">
        <h1>TETRIS</h1>

        <div class="stats">
          <div class="stat">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span>Lines</span>
            <strong id="lines">0</strong>
          </div>
          <div class="stat">
            <span>Level</span>
            <strong id="level">1</strong>
          </div>
        </div>

        <div class="palette" aria-label="Game color palette">
          <span class="swatch swatch-cyan" aria-label="Cyan"></span>
          <span class="swatch swatch-gold" aria-label="Gold"></span>
          <span class="swatch swatch-violet" aria-label="Violet"></span>
          <span class="swatch swatch-green" aria-label="Green"></span>
        </div>

        <button id="start-btn" type="button">Start Game</button>
        <p id="status">Press start to play.</p>
      </aside>

      <div class="board-wrap">
        <canvas id="game" width="300" height="600" aria-label="Tetris board"></canvas>
      </div>

        <div class="controls">
          <h2>Controls</h2>
          <ul>
            <li>← / → move</li>
            <li>↑ rotate</li>
            <li>↓ soft drop</li>
            <li>Space hard drop</li>
            <li>P pause</li>
          </ul>
        </div>

        <div class="mobile-controls" aria-label="Touch controls">
          <div class="mobile-row">
            <button type="button" data-action="left" aria-label="Move left">◀</button>
            <button type="button" data-action="rotate" aria-label="Rotate">⟳</button>
            <button type="button" data-action="right" aria-label="Move right">▶</button>
          </div>
          <div class="mobile-row">
            <button type="button" data-action="down" aria-label="Soft drop">▼</button>
            <button type="button" data-action="drop" aria-label="Hard drop">Drop</button>
            <button type="button" data-action="pause" aria-label="Pause">Pause</button>
          </div>
        </div>
      </aside>
    </main>

    <script src="script.js?v=6"></script>
  </body>
</html>
